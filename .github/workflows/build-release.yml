# Builds this module against the core Araxia runs, and tags a release when a push to
# main builds.
#
# The core is araxiaonline/azerothcore-wotlk-mod-playerbots, checked out fresh at the
# branch below on every run. It used to come from a prebuilt container image
# (ac-wotlk-worldserver-devcontainer) whose core was never refreshed: once the module
# needed something newer than that snapshot, this check failed on every run.
name: Build And Release
on:
    push:
        branches:
            - 'main'
    pull_request:
        branches:
            - 'main'

env:
    CORE_REPOSITORY: araxiaonline/azerothcore-wotlk-mod-playerbots
    CORE_REF: Playerbot

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build-release:
        runs-on: ubuntu-24.04
        permissions:
            # The release step pushes a tag and creates a release.
            contents: write
        steps:
            - name: checkout core
              uses: actions/checkout@v4
              with:
                repository: ${{ env.CORE_REPOSITORY }}
                ref: ${{ env.CORE_REF }}

            - name: checkout module
              uses: actions/checkout@v4
              with:
                path: modules/${{ github.event.repository.name }}

            - name: get core revision
              id: core
              run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: install requirements
              run: |
                sudo apt-get update
                sudo apt-get install -y git cmake make clang ccache \
                  libmysqlclient-dev libssl-dev libbz2-dev \
                  libreadline-dev libncurses-dev libboost-all-dev

            # Nearly all of the build is the core, which only changes when its branch
            # moves: with a warm cache a run recompiles little more than the module.
            - name: restore ccache
              uses: actions/cache@v4
              with:
                path: ${{ github.workspace }}/.ccache
                key: ccache-${{ runner.os }}-${{ steps.core.outputs.sha }}-${{ github.sha }}
                restore-keys: |
                  ccache-${{ runner.os }}-${{ steps.core.outputs.sha }}-
                  ccache-${{ runner.os }}-

            - name: configure
              env:
                CCACHE_DIR: ${{ github.workspace }}/.ccache
              run: |
                ccache --zero-stats
                cmake -B build -S . \
                  -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                  -DCMAKE_C_COMPILER=clang \
                  -DCMAKE_CXX_COMPILER=clang++ \
                  -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                  -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                  -DAPPS_BUILD=world-only \
                  -DTOOLS_BUILD=none \
                  -DSCRIPTS=static \
                  -DMODULES=static \
                  -DWITH_WARNINGS=ON

            # The worldserver, not just the module library: modules are static, so a
            # symbol the module uses but the core does not provide only fails at link.
            - name: build
              env:
                CCACHE_DIR: ${{ github.workspace }}/.ccache
              run: |
                cmake --build build --target worldserver -j "$(($(nproc) + 1))"
                ccache --show-stats

            # Minor bump of the latest release, with generated notes.
            #
            # Done here rather than with rymndhng/release-on-push-action, which requires the
            # latest tag to be major.minor.patch: this repo's releases were tagged by hand as
            # two-part versions (v0.9), and the action dies on the missing patch number.
            # A two-part tag is read as patch 0, and new tags are always three-part.
            - name: tag release
              if: github.event_name == 'push'
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                GH_REPO: ${{ github.repository }}
              run: |
                # Empty only when the repo has no release at all; a failed lookup fails the step
                # instead of restarting the numbering.
                latest="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
                version="${latest#v}"
                IFS=. read -r major minor patch <<< "${version:-0.0.0}"
                if ! [[ "$major" =~ ^[0-9]+$ && "${minor:-0}" =~ ^[0-9]+$ ]]; then
                  echo "latest release tag '$latest' is not a version this step can bump"
                  exit 1
                fi
                next="v${major}.$(( ${minor:-0} + 1 )).0"
                echo "latest release: ${latest:-none} -> $next"
                gh release create "$next" --target "$GITHUB_SHA" --title "$next" --generate-notes
